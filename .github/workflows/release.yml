name: Release

on:
  push:
    branches: [main]

# Releases are serial by nature: a second push should update the pending
# release PR, never race a build that is already uploading assets. Unlike CI,
# an in-flight run here must not be cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Every release must be Developer ID signed and notarized: an ad-hoc build
  # downloads quarantined, Gatekeeper rejects it, and the in-app updater
  # refuses to install it. This runs before release-please rather than in
  # build-macos because by the time build-macos starts, the tag and GitHub
  # release already exist, so failing there would leave a published release
  # with no asset. Failing here means no release PR, and so no release, until
  # `deno task setup:release` has stored the secrets.
  #
  # MACOS_CERTIFICATE_PASSWORD isn't checked: a .p12 exported without a
  # password is valid, and Actions can't tell an empty secret from a missing
  # one. A missing password for a .p12 that has one still fails the build, at
  # "Import Developer ID certificate", before anything is signed or uploaded.
  signing-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Require Apple signing secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in MACOS_CERTIFICATE MACOS_SIGN_IDENTITY APPLE_API_KEY \
            APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}. Releases must be signed and notarized; run deno task setup:release."
            exit 1
          fi
          echo "Signing secrets are set."

  # Keeps a "chore(main): release x.y.z" PR open and up to date with every
  # conventional commit that lands on main. Merging that PR is the release:
  # it bumps deno.jsonc, writes CHANGELOG.md, tags, and cuts the GitHub
  # release, which is what triggers the build below.
  #
  # release-please-config.json is strict JSON and can't explain itself, so:
  # release-type is "go" purely because that strategy writes no version file
  # of its own. Every other strategy insists on one (simple → version.txt,
  # node → package.json), which would mean two places claiming to know the
  # version. Here deno.jsonc's "version" is the only one, updated via the
  # generic updater and its x-release-please-version annotation. Nothing
  # about the build is Go-specific.
  #
  # bump-minor-pre-major keeps a breaking change below 1.0 at 0.x → 0.(x+1)
  # instead of release-please's default, which would read a single `feat!:` as
  # "ship 1.0.0" and make a stable-API promise by accident. Going to 1.0 should
  # be deliberate: put `Release-As: 1.0.0` in a commit footer when it's time.
  #
  # initial-version matters only for the very first release, and it is not
  # redundant with the above: with no git tag to bump from, release-please skips
  # the versioning strategy entirely and returns initialReleaseVersion(), which
  # defaults to 1.0.0. Without this the first release would ship as 1.0.0 no
  # matter what the commits or the manifest say.
  release-please:
    needs: signing-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # GITHUB_TOKEN works, but CI runs on a release PR it opens or updates
          # are triggered by github-actions[bot], and GitHub holds those as
          # "action required" until someone approves them. Setting
          # RELEASE_PLEASE_TOKEN makes release-please act as that token's owner
          # instead, so CI runs without approval. Use a fine-grained PAT for
          # this repo only, with read and write access to Contents, Pull
          # requests and Issues (Issues is for the release labels).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # macOS-only because `deno desktop` builds the .app with the platform's own
  # toolchain, and signing/notarization needs codesign and notarytool.
  build-macos:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      APP: dist/MemGui.app
      # All guaranteed non-empty by signing-secrets, so no step below is
      # conditional on them: a release is signed, notarized and passes
      # Gatekeeper, or the job fails and nothing is uploaded.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      # Build the tag, not the branch head: another push can land on main
      # between the release commit and this job starting.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Test the exact commit being shipped before signing anything.
      - name: Checks
        run: deno task checks

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Runner-lifetime keychain; the lock timeout just bounds the damage
          # if a job hangs.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt for keychain access
          # that no one is there to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Keep login.keychain in the search list: the Apple intermediate
          # certs live there and codesign needs them to build the chain.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          rm "$RUNNER_TEMP/cert.p12"

      # Builds, writes the version into Info.plist, adds the installer the
      # in-app updater runs, and re-signs the bundle with the Hardened Runtime,
      # a secure timestamp and .github/entitlements.plist.
      - name: Build and sign
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: deno task package:mac

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 "$APP"

      # Without allow-jit, V8 can't reserve its CodeRange under the Hardened
      # Runtime and the app aborts at launch. Neither codesign nor notarization
      # objects if it's missing, so assert it's really in the signature.
      - name: Verify JIT entitlement
        run: |
          set -euo pipefail
          if ! codesign -d --entitlements - --xml "$APP" 2>/dev/null \
            | grep -q "com.apple.security.cs.allow-jit"; then
            echo "::error::allow-jit missing from the signed bundle; V8 would abort at launch."
            exit 1
          fi
          echo "allow-jit present."

      # The updater checks a download's version here before installing it.
      - name: Verify bundle version
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          ACTUAL="$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          if [ "$ACTUAL" != "${TAG#v}" ]; then
            echo "::error::Info.plist says $ACTUAL, release is ${TAG#v}."
            exit 1
          fi
          test -f "$APP/Contents/Resources/install.zsh"

      # If notarization rejects a build, this says whether the runtime flag,
      # timestamp or entitlements went missing rather than the credentials.
      - name: Report signing state
        run: |
          for target in "$APP" "$APP/Contents/MacOS/laufey_webview"; do
            echo "── $target"
            codesign -dvvv "$target" 2>&1 | grep -E "^(CodeDirectory|Identifier|TeamIdentifier|Timestamp|Authority)" || true
            codesign -d --entitlements - --xml "$target" 2>/dev/null || true
            echo
          done

      - name: Notarize and staple
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/api-key.p8"

          # notarytool won't take a bundle directory; the zip is purely a
          # transport for the submission.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/api-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          # Staple the ticket into the .app itself so first launch validates
          # without a network round trip. The asset is zipped after this.
          xcrun stapler staple "$APP"
          rm "$RUNNER_TEMP/api-key.p8"

      - name: Verify Gatekeeper acceptance
        run: spctl --assess --type execute --verbose=4 "$APP"

      - name: Package
        run: |
          set -euo pipefail
          # ditto, not `zip`: it preserves the symlinks and extended attributes
          # inside a .app bundle that the signature is computed over.
          ARCH="$(uname -m)"
          ASSET="MemGui-${{ needs.release-please.outputs.tag_name }}-macos-$ARCH.zip"
          ditto -c -k --keepParent "$APP" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "$ASSET" --clobber
