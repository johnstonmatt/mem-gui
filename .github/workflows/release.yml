name: Release

on:
  push:
    branches: [main]

# Releases are serial by nature: a second push should update the pending
# release PR, never race a build that is already uploading assets. Unlike CI,
# an in-flight run here must not be cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a "chore(main): release x.y.z" PR open and up to date with every
  # conventional commit that lands on main. Merging that PR is the release:
  # it bumps deno.jsonc, writes CHANGELOG.md, tags, and cuts the GitHub
  # release — which is what triggers the build below.
  #
  # release-please-config.json is strict JSON and can't explain itself, so:
  # release-type is "go" purely because that strategy writes no version file
  # of its own. Every other strategy insists on one (simple → version.txt,
  # node → package.json), which would mean two places claiming to know the
  # version. Here deno.jsonc's "version" is the only one, updated via the
  # generic updater and its x-release-please-version annotation. Nothing
  # about the build is Go-specific.
  #
  # bump-minor-pre-major keeps a breaking change below 1.0 at 0.x → 0.(x+1)
  # instead of release-please's default, which would read a single `feat!:` as
  # "ship 1.0.0" and make a stable-API promise by accident. Going to 1.0 should
  # be deliberate: put `Release-As: 1.0.0` in a commit footer when it's time.
  #
  # initial-version matters only for the very first release, and it is not
  # redundant with the above: with no git tag to bump from, release-please skips
  # the versioning strategy entirely and returns initialReleaseVersion(), which
  # defaults to 1.0.0. Without this the first release would ship as 1.0.0 no
  # matter what the commits or the manifest say.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # GITHUB_TOKEN works, but PRs opened with it don't trigger other
          # workflows, so ci.yml never runs on the release PR. Set a PAT with
          # repo scope as RELEASE_PLEASE_TOKEN to get checks on it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # macOS-only because `deno desktop` builds the .app with the platform's own
  # toolchain, and signing/notarization needs codesign and notarytool.
  build-macos:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      APP: dist/MemGui.app
      # These are empty until the Apple Developer secrets are configured, and
      # every signing step below is skipped when they are — the build still
      # produces a runnable ad-hoc signed .app, it just trips Gatekeeper once
      # downloaded. That way the release pipeline works before the paid
      # developer account does.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      # Build the tag, not the branch head — another push can land on main
      # between the release commit and this job starting.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Pinned, not v2.x, so the toolchain that builds a release changes only
      # when someone bumps this and re-checks the steps below against it. A
      # floating version already changed things here unannounced: v0.1.4 was
      # built on 2.9.4, and a release on 2.9.7 would have built
      # dist/MemGui.app.app (see the note on build:mac in deno.jsonc) and failed
      # every step after the build.
      #
      # 2.9.6 fixed two `deno desktop` signing defects (icon copied in after
      # signing; .update-ok written into the bundle on every launch, which
      # broke the signature of every shipped copy the first time it was
      # opened; denoland/deno#36574). The third, the missing JIT entitlement,
      # is still open in 2.9.7, so "Re-seal bundle" stays. When bumping, check
      # whether `deno desktop` now attaches allow-jit itself: if "Report
      # signing state" shows it before the re-seal, that step can go.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Runner-lifetime keychain; the lock timeout just bounds the damage
          # if a job hangs.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt for keychain access
          # that no one is there to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Keep login.keychain in the search list: the Apple intermediate
          # certs live there and codesign needs them to build the chain.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          rm "$RUNNER_TEMP/cert.p12"

      - name: Set signing identity
        if: env.MACOS_SIGN_IDENTITY != ''
        run: |
          deno run --allow-read=deno.jsonc --allow-write=deno.jsonc \
            scripts/set_codesign_identity.ts "$MACOS_SIGN_IDENTITY"

      - name: Build
        run: deno task build:mac

      # build:mac passes --output without the extension because Deno 2.9.7
      # appends ".app" to whatever it's given (see the note in deno.jsonc). If
      # that changes again the bundle lands somewhere else, and every step below
      # would fail on a missing path with nothing pointing here, so check once.
      - name: Check bundle path
        run: |
          if [ ! -d "$APP" ]; then
            echo "::error::Build produced no $APP. Found: $(ls dist)"
            exit 1
          fi

      # `deno desktop` signs with the Hardened Runtime and a secure timestamp
      # for any real identity, which is what notarization needs, but attaches no
      # entitlements to a webview app, and has no setting to make it. Under the
      # Hardened Runtime mmap(MAP_JIT) is denied without
      # com.apple.security.cs.allow-jit, so V8 can't reserve its executable
      # CodeRange and aborts before the window opens. That is how v0.1.1
      # shipped and died on launch, and it reproduces on a Deno 2.9.7 build
      # signed with a real Developer ID:
      #
      #   # Fatal process out of memory: Failed to reserve virtual memory for CodeRange
      #
      # Entitlements can only be set by signing, so this re-signs the outer
      # bundle with them. CFBundleExecutable is laufey_webview, the Mach-O that
      # hosts V8, so that's where they take effect. Deliberately no --deep: the
      # runtime dylib keeps the signature deno gave it, which is also Apple's
      # guidance over --deep. The upstream fix is #3 in denoland/deno#36421.
      #
      # This used to also re-seal the icon, which deno copied in after signing;
      # 2.9.6 fixed that, so ad-hoc builds (no identity configured) skip this
      # step: there's no Hardened Runtime to work around, and deno's signature
      # is already valid. See .github/entitlements.plist for why allow-jit is
      # the only key.
      - name: Re-seal bundle
        if: env.MACOS_SIGN_IDENTITY != ''
        run: |
          codesign --force --options runtime --timestamp \
            --entitlements .github/entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 "$APP"

      # A silently-empty --entitlements would ship another build that dies at
      # V8 init, and neither codesign nor notarization would object. Assert the
      # entitlement is really in the signature rather than trusting the flag.
      - name: Verify JIT entitlement
        if: env.MACOS_SIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          if ! codesign -d --entitlements - --xml "$APP" 2>/dev/null \
            | grep -q "com.apple.security.cs.allow-jit"; then
            echo "::error::allow-jit missing from the signed bundle — V8 would abort at launch."
            exit 1
          fi
          echo "allow-jit present."

      # Notarization requires the Hardened Runtime and a secure timestamp on
      # every Mach-O in the bundle, and V8 needs the JIT entitlement once the
      # runtime is on. On Deno 2.9.7 with a real Developer ID, deno gives all
      # three Mach-Os runtime and a timestamp, and the re-seal adds allow-jit to
      # the bundle and laufey_webview (checked locally). Print it anyway: if
      # notarization rejects a build, this says whether a runtime flag,
      # timestamp or entitlement went missing rather than the credentials, and
      # after a Deno bump it shows whether deno now attaches allow-jit itself.
      - name: Report signing state
        run: |
          for target in "$APP" "$APP/Contents/MacOS/laufey_webview" \
            "$APP/Contents/MacOS/libruntime.dylib"; do
            echo "── $target"
            codesign -dvvv "$target" 2>&1 | grep -E "^(CodeDirectory|Identifier|TeamIdentifier|Timestamp)" || true
            codesign -d --entitlements - --xml "$target" 2>/dev/null || true
            echo
          done

      - name: Notarize and staple
        if: env.APPLE_API_KEY != ''
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/api-key.p8"

          # notarytool won't take a bundle directory — the zip is purely a
          # transport for the submission.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/api-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          # Staple the ticket into the .app itself so first launch validates
          # without a network round trip. The asset is zipped after this.
          xcrun stapler staple "$APP"
          rm "$RUNNER_TEMP/api-key.p8"

      - name: Verify Gatekeeper acceptance
        if: env.APPLE_API_KEY != ''
        run: spctl --assess --type execute --verbose=4 "$APP"

      - name: Package
        run: |
          set -euo pipefail
          # ditto, not `zip`: it preserves the symlinks and extended attributes
          # inside a .app bundle that the signature is computed over.
          ASSET="MemGui-${{ needs.release-please.outputs.tag_name }}-macos-arm64.zip"
          ditto -c -k --keepParent "$APP" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "$ASSET" --clobber
