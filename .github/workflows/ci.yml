name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, and to the same version release.yml builds with: see the note
      # there.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      # Kept as separate steps rather than `deno task checks` so a failure names
      # which check broke without having to open the log.
      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check main.ts src scripts

      - name: Test
        run: deno test --allow-env --allow-read --allow-write

      # The app has no dependencies on purpose: any remote module in the graph
      # breaks `deno desktop`'s webview bindings, which fails at runtime in the
      # window rather than at build time, where no check above would catch it.
      # See the note at the top of src/paths.ts.
      - name: No remote dependencies
        run: |
          if grep -rnE 'from "(jsr:|npm:|https?:)' main.ts src public; then
            echo "::error::Remote import found — this breaks deno desktop's bindings (see src/paths.ts)."
            exit 1
          fi
          echo "No remote imports."

  # The same packaging the release uses, ad-hoc signed, so a broken bundle,
  # plist or installer is caught on the PR rather than after a release is cut.
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Package app
        run: deno task package:mac

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP=dist/MemGui.app
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -f "$APP/Contents/Resources/install.zsh"

      - name: Shell scripts parse
        run: for f in scripts/*.zsh; do zsh -n "$f"; done
